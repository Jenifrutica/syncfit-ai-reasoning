name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout syncfit-ai-reasoning
        uses: actions/checkout@v4

      - name: Checkout sibling syncfit-contracts
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-contracts
          path: deps/syncfit-contracts
          token: ${{ secrets.SYNCFIT_TOKEN }}

      - name: Checkout sibling syncfit-core
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-core
          path: deps/syncfit-core
          token: ${{ secrets.SYNCFIT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./deps/syncfit-contracts/python ./deps/syncfit-core
          pip install --no-deps -e .
          pip install pytest

      - name: Test
        run: pytest -q
