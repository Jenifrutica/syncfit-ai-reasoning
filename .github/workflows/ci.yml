# NOTE: this repository depends on two sibling private repositories
# (syncfit-contracts and syncfit-core), cloned here using the SYNCFIT_TOKEN
# secret. TODO: when those repositories are public, remove the `token:` inputs
# and delete the SYNCFIT_TOKEN secret.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout syncfit-ai-reasoning
        uses: actions/checkout@v4

      - name: Checkout sibling syncfit-contracts
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-contracts
          path: deps/syncfit-contracts
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}

      - name: Checkout sibling syncfit-core
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-core
          path: deps/syncfit-core
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./deps/syncfit-contracts/python ./deps/syncfit-core
          pip install openai pydantic pytest
          pip install --no-deps -e .

      - name: Test
        run: pytest -q

