[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncfit-ai-reasoning"
version = "0.1.0"
description = "SyncFit Edge cloud reasoning kernel: DeepSeek biomechanical audit with strict JSON Mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "syncfit-contracts @ git+https://github.com/Jenifrutica/syncfit-contracts.git#subdirectory=python",
    "syncfit-core @ git+https://github.com/Jenifrutica/syncfit-core.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = [
    "syncfit_ai",
    "syncfit_ai.client",
    "syncfit_ai.prompts",
    "syncfit_ai.schema",
    "syncfit_ai.rules",
    "syncfit_ai.structures",
]

[tool.setuptools.package-data]
syncfit_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
